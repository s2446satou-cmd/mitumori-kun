<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>見積もりくん 試作版</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#f4f6f9;color:#172033;margin:0}main{max-width:650px;margin:auto;padding:18px}h1{font-size:24px;margin:8px 0}p{color:#526070}section{background:white;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #16243a0a}label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}input,select{box-sizing:border-box;width:100%;border:1px solid #cfd5de;border-radius:9px;padding:12px;font-size:16px;background:white}button{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;background:#1746ad;color:white;margin:5px 4px 5px 0}button.alt{background:#e9eef9;color:#15356f}button.danger{background:#fce7e7;color:#922}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border-top:1px solid #eee;margin-top:12px;padding-top:12px}.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.grand{font-size:22px;font-weight:800;color:#1746ad}.hint{font-size:12px}.actions{display:flex;flex-wrap:wrap}@media print{body{background:white}main{padding:0}section{box-shadow:none;border-radius:0;padding:6px 0;margin:5px 0}button,.noprint,.hint{display:none!important}input{border:0;padding:4px 0}h1{font-size:21px}.item{break-inside:avoid}}</style></head><body><main><h1>🧰 見積もりくん <small style="font-size:12px">試作版</small></h1><p class="noprint">iPhoneだけで工事見積もりを作成。入力内容はこのブラウザ内に一時保存できます。</p><section><div class="row"><div><label>発行者・屋号</label><input id="company" placeholder="例：○○設備"></div><div><label>お客様名</label><input id="client" placeholder="例：山田様"></div></div><label>工事名</label><input id="job" placeholder="例：ルームエアコン交換工事"><div class="row"><div><label>発行日</label><input id="date" type="date"></div><div><label>見積番号</label><input id="no" placeholder="例：001"></div></div></section><section><h2 style="font-size:18px">見積明細</h2><div id="items"></div><button class="alt noprint" onclick="addItem()">＋ 明細を追加</button></section><section><h2 style="font-size:18px">原価・税率</h2><div class="row"><div><label>原価合計（円）</label><input id="cost" type="number" min="0" value="0"></div><div><label>消費税率（%）</label><input id="tax" type="number" min="0" value="10"></div></div><div id="totals"></div><p class="hint">利益額・利益率は税抜売上から入力原価を引いた概算です。実際の経費や税務処理は別途確認してください。</p></section><section class="noprint"><div class="actions"><button onclick="window.print()">印刷・PDF保存</button><button class="alt" onclick="save()">端末に保存</button><button class="alt" onclick="load()">保存を読み込み</button><button class="danger" onclick="resetAll()">入力を消去</button></div><p class="hint">iPhoneでは「印刷・PDF保存」を押し、印刷プレビューから共有・ファイル保存を選んでください。保存は同じブラウザの同じページで開いた場合に限り利用できることがあります。顧客の機密情報を入れる前に取り扱いを確認してください。</p></section></main><script>
const $=id=>document.getElementById(id);const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';
function addItem(d={name:'',qty:1,unit:'式',price:0}){let e=document.createElement('div');e.className='item';e.innerHTML='<label>品名・作業内容</label><input class="name" placeholder="例：エアコン取付工事"><div class="row"><div><label>数量</label><input class="qty" type="number" min="0" step="0.1"></div><div><label>単位</label><input class="unit" placeholder="式・m・台"></div></div><label>単価（円・税抜）</label><input class="price" type="number" min="0"><button class="danger noprint" onclick="this.parentNode.remove();calc()">削除</button>'; $('items').append(e);for(let k of ['name','qty','unit','price'])e.querySelector('.'+k).value=d[k];e.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc()}
function rows(){return [...document.querySelectorAll('.item')].map(e=>Object.fromEntries(['name','qty','unit','price'].map(k=>[k,e.querySelector('.'+k).value])))}
function calc(){let subtotal=rows().reduce((a,r)=>a+(Number(r.qty)||0)*(Number(r.price)||0),0),tax=subtotal*(Number($('tax').value)||0)/100,total=subtotal+tax,cost=Number($('cost').value)||0,profit=subtotal-cost,rate=subtotal?profit/subtotal*100:0;$('totals').innerHTML=`<div class="sum"><span>税抜小計</span><b>${yen(subtotal)}</b></div><div class="sum"><span>消費税（概算）</span><b>${yen(tax)}</b></div><div class="sum grand"><span>税込合計</span><span>${yen(total)}</span></div><div class="sum"><span>概算利益（税抜）</span><b>${yen(profit)}</b></div><div class="sum"><span>概算利益率</span><b>${rate.toFixed(1)}%</b></div>`}
let fields=['company','client','job','date','no','cost','tax'];function save(){try{localStorage.setItem('mitumori-kun-v1',JSON.stringify({fields:Object.fromEntries(fields.map(k=>[k,$(k).value])),items:rows()}));alert('この端末のブラウザに保存しました')}catch(e){alert('保存できませんでした。PDF保存をご利用ください')}}function load(){let raw=localStorage.getItem('mitumori-kun-v1');if(!raw){alert('保存データがありません');return}let d=JSON.parse(raw);fields.forEach(k=>$(k).value=d.fields[k]??'');$('items').innerHTML='';d.items.forEach(addItem);calc()}function resetAll(){if(!confirm('すべての入力を消去しますか？'))return;fields.forEach(k=>$(k).value='');$('items').innerHTML='';addItem();calc()}fields.forEach(k=>$(k).addEventListener('input',calc));$('date').value=new Date().toLocaleDateString('sv-SE');addItem({name:'既存機撤去',qty:1,unit:'式',price:5000});addItem({name:'新規取付',qty:1,unit:'式',price:18000});addItem({name:'配管材料',qty:1,unit:'式',price:8000});calc();
</script></body></html>
